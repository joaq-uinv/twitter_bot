[project]
name = "tweet-relay"
version = "0.1.0"
description = "Relays new posts from an X profile to WhatsApp"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "defusedxml>=0.7.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "hypothesis>=6.100", "respx>=0.21"]

[project.scripts]
tweet-relay = "tweet_relay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tweet_relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: hits real network; excluded by default (constitution §5)"]
addopts = "-m 'not live' --strict-markers -q"
filterwarnings = ["error"]
